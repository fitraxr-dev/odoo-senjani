services:
  db:
    image: postgres:16
    container_name: odoo18-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  odoo:
    image: odoo:18
    container_name: odoo18-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mailhog:
        condition: service_started
    ports:
      - "8069:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
      # --- Konfigurasi SMTP untuk Mailhog ---
      SMTP_SERVER: mailhog
      SMTP_PORT: 1025
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      SMTP_SSL: False
    volumes:
      - odoo_data:/var/lib/odoo
      - ./odoo/conf/odoo.conf:/etc/odoo/odoo.conf
      - ./odoo/addons:/mnt/extra-addons

  mailhog:
    image: mailhog/mailhog:latest
    container_name: odoo18-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
  odoo_data: